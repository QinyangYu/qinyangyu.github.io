<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}'s Homepage{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="keywords" content="{{ site.keywords }}">
<meta name="author" content="{{ site.title }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ site.avatar | absolute_url }}">
<meta name="twitter:card" content="summary">
{%- if site.google_site_verification %}
<meta name="google-site-verification" content="{{ site.google_site_verification }}">
{%- endif %}
{%- if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}/",
  "image": "{{ site.portrait | absolute_url }}",
  "email": "mailto:{{ site.email }}",
  "jobTitle": "PhD Student",
  "description": "{{ site.description }}",
  "affiliation": {
    "@type": "Organization",
    "name": "School of Data Science, University of Virginia",
    "url": "https://datascience.virginia.edu/"
  },
  "alumniOf": [
    { "@type": "CollegeOrUniversity", "name": "Duke University" },
    { "@type": "CollegeOrUniversity", "name": "The Chinese University of Hong Kong, Shenzhen" }
  ],
  "sameAs": [
    "{{ site.linkedin }}",
    "{{ site.github_link }}",
    "https://datascience.virginia.edu/people/qinyang-yu"
  ]
}
</script>
{%- endif %}

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="icon" href="{{ site.favicon | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/img/favicon-192.png' | relative_url }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
